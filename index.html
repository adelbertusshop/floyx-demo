
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A + B</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fafafa;
      padding: 50px;
    }
    input {
      padding: 10px;
      margin: 10px;
      width: 100px;
      font-size: 18px;
    }
    button {
      padding: 10px 20px;
      background-color: #0078ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005ecb;
    }
    h1 {
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Prosty kalkulator A + B</h1>
  <input type="number" id="a" placeholder="A" />
  <input type="number" id="b" placeholder="B" />
  <br />
  <button onclick="sumuj()">Policz</button>
  <h2 id="wynik"></h2>

  <script>
    function sumuj() {
      const a = parseFloat(document.getElementById('a').value) || 0;
      const b = parseFloat(document.getElementById('b').value) || 0;
      const suma = a + b;
      document.getElementById('wynik').textContent = "Wynik: " + suma;
    }
  </script>
</body>
</html>
